[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-smart"
version = "0.1.0"
description = "FPL decision engine: data pipeline, expected-points model, multi-gameweek transfer optimiser"
requires-python = ">=3.11"
dependencies = [
  "requests", "pandas", "numpy", "scipy", "pyarrow", "pulp>=2.9,<4", "highspy",
  "lightgbm", "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fpl = "fpl_smart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
